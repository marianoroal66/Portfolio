<!DOCTYPE html>
<html lang="es" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Proyectos | Mariano Rodríguez Ebanistería</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#faf7f2',
                            100: '#f3ece0',
                            500: '#c59b63',
                            600: '#b0834c',
                            900: '#1c1917',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Personalización de Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0c0a09; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

        /* Masonry Grid Layout */
        .masonry-grid {
            column-count: 1;
            column-gap: 1.5rem;
        }
        @media (min-width: 640px) { .masonry-grid { column-count: 2; } }
        @media (min-width: 1024px) { .masonry-grid { column-count: 3; } }
        .masonry-item { break-inside: avoid; margin-bottom: 1.5rem; }

        /* Zoom en Hover */
        .img-hover-zoom {
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .masonry-item:hover .img-hover-zoom {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-stone-950 text-stone-100 font-sans antialiased selection:bg-brand-500 selection:text-stone-950 min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-stone-950/90 backdrop-blur-md border-b border-stone-800/80 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            
            <!-- Logo Brand -->
            <a href="#" class="flex items-center gap-3 group">
                <div class="w-12 h-12 rounded-full overflow-hidden border border-brand-500/40 group-hover:border-brand-500 transition-colors flex items-center justify-center bg-stone-900 p-1">

                    <!-- Logo JPG servido por GitHub Pages, independiente de Google Drive -->
                    <img
                        id="company-logo"
                        src="./logo.JPG?v=4"
                        alt="Logo Mariano Rodríguez"
                        class="w-full h-full object-contain"
                        decoding="async"
                    >
                </div>
                <div>
                    <span class="font-serif text-xl sm:text-2xl font-bold tracking-tight text-stone-100 group-hover:text-brand-500 transition-colors">Mariano Rodríguez</span>
                    <span class="block text-[10px] uppercase tracking-widest text-stone-400 font-sans">Ebanistería & Interiorismo</span>
                </div>
            </a>
        </div>
    </header>

    <!-- Main Content: Galería de Proyectos -->
    <main class="flex-grow py-10 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">
        
        <!-- Gallery Header Banner -->
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-10 pb-6 border-b border-stone-800">
            <div>
                <h1 class="font-serif text-3xl sm:text-4xl font-bold text-stone-100">Galería de Proyectos</h1>
            </div>

            <div class="text-xs text-stone-400">
                Mostrando <span id="project-count" class="text-brand-500 font-bold">0</span> proyectos
            </div>
        </div>

        <!-- Filters & Search Toolbar -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-8">
            <!-- Categorías -->
            <div class="flex flex-wrap items-center gap-2" id="category-filters">
                <!-- Renderizado dinámico por JavaScript -->
            </div>

            <!-- Buscador en tiempo real -->
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="relative flex-grow md:w-72">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-500 text-xs"></i>
                    <input type="text" id="search-input" oninput="filterPhotos()" placeholder="Buscar madera, acabado o proyecto..." 
                           class="w-full bg-stone-900 border border-stone-800 rounded-full pl-9 pr-4 py-2 text-sm text-stone-200 placeholder-stone-500 focus:outline-none focus:border-brand-500 transition-colors">
                </div>
            </div>
        </div>

        <!-- Componente Loader / Cargando -->
        <div id="loading-state" class="py-24 text-center space-y-4">
            <div class="w-12 h-12 border-4 border-brand-500/20 border-t-brand-500 rounded-full animate-spin mx-auto"></div>
            <p class="text-stone-400 text-sm tracking-wide">Cargando proyectos desde Google Drive...</p>
        </div>

        <!-- Container Grid de Fotos / Proyectos -->
        <div id="photos-container" class="masonry-grid min-h-[400px] hidden">
            <!-- Renderizado dinámico con JS -->
        </div>

        <!-- Mensaje cuando no hay resultados -->
        <div id="empty-state" class="hidden py-20 text-center space-y-4">
            <div class="w-16 h-16 rounded-full bg-stone-900 border border-stone-800 flex items-center justify-center mx-auto text-stone-500 text-2xl">
                <i class="fa-solid fa-tree"></i>
            </div>
            <h3 class="text-lg font-medium text-stone-300">No se encontraron proyectos</h3>
            <p class="text-stone-500 text-sm max-w-md mx-auto">Intenta ajustar los criterios de búsqueda o cambiar de categoría.</p>
            <button onclick="resetFilters()" class="text-brand-500 text-sm font-semibold hover:underline">Restablecer Filtros</button>
        </div>

    </main>

    <!-- POP-UP MODAL: LIGHTBOX / DETALLE DEL PROYECTO -->
    <div id="lightbox-modal" class="fixed inset-0 z-50 hidden bg-stone-950/95 backdrop-blur-xl flex flex-col justify-between p-4 sm:p-6 transition-opacity duration-300">
        
        <div class="flex items-center justify-between z-10">
            <div class="text-stone-300 text-xs sm:text-sm font-medium" id="lightbox-counter">Imagen 1 de 1</div>
            <div class="flex items-center gap-3">
                <button onclick="downloadCurrentImage()" class="p-2.5 rounded-full bg-stone-900 border border-stone-800 text-stone-300 hover:text-white transition-colors" title="Abrir imagen completa">
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                </button>
                <button onclick="closeLightbox()" class="p-2.5 rounded-full bg-stone-900 border border-stone-800 text-stone-300 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
        </div>

        <div class="relative flex-grow flex items-center justify-center my-4 overflow-hidden">
            <button onclick="prevPhoto()" class="absolute left-2 sm:left-6 z-20 p-3.5 rounded-full bg-stone-900/80 border border-stone-800 text-stone-300 hover:text-white transition-all backdrop-blur-md">
                <i class="fa-solid fa-chevron-left text-sm"></i>
            </button>
            <button onclick="nextPhoto()" class="absolute right-2 sm:right-6 z-20 p-3.5 rounded-full bg-stone-900/80 border border-stone-800 text-stone-300 hover:text-white transition-all backdrop-blur-md">
                <i class="fa-solid fa-chevron-right text-sm"></i>
            </button>

            <div class="max-h-full max-w-5xl flex flex-col items-center justify-center p-2">
                <img id="lightbox-image" src="" alt="" referrerpolicy="no-referrer" class="max-h-[60vh] sm:max-h-[65vh] w-auto max-w-full object-contain rounded-lg shadow-2xl">
                <div id="lightbox-thumbnails" class="flex items-center gap-2 mt-4 overflow-x-auto max-w-full py-1"></div>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw5kWQELT_08WyCtW4kwODyBgJ52eLRhmAgN3rFBwlHhkZHYhYet5Yzzj_45vE-S88/exec";

        const fallbackProjectsData = [
            {
                id: 1,
                title: "Boiserie Integrada 'Velázquez'",
                category: "Panelados & Boiseries",
                location: "Barrio Salamanca, Madrid",
                wood: "Roble Francés Ahumado",
                finish: "Aceite Mate Natural",
                craft: "Fresado Geométrico Rasante",
                images: [
                    "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80",
                    "https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1200&q=80"
                ],
                desc: "Panelado arquitectónico completo con puertas pivotantes integradas e iluminación escénica LED oculta."
            },
            {
                id: 2,
                title: "Mesa Escultórica 'Nebra'",
                category: "Mobiliario a Medida",
                location: "Madrid, España",
                wood: "Nogal Español Seleccionado",
                finish: "Cera Orgánica Efecto Seda",
                craft: "Ensamble Cola de Milano Oculta",
                images: [
                    "https://images.unsplash.com/photo-1538688525198-9b88f6f53126?auto=format&fit=crop&w=1200&q=80",
                    "https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1200&q=80"
                ],
                desc: "Pieza central tallada a mano en tablones macizos de nogal centenario con veteado simétrico."
            }
        ];

        let projectsData = [];
        let availableCategories = ["Todos"];
        let activeCategory = "Todos";
        let currentLightboxProjectIndex = 0;
        let currentLightboxImageIndex = 0;

        document.addEventListener("DOMContentLoaded", () => {
            const currentYearEl = document.getElementById("current-year");
            if (currentYearEl) {
                currentYearEl.textContent = new Date().getFullYear();
            }
            loadProjectsFromAPI();
        });

        // Función para adaptar URLs de Google Drive a enlaces compatibles con navegadores móviles
        function formatDriveUrl(url) {
            if (!url) return "";
            const match = url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            return url;
        }

        // El logo se sirve como archivo estático; esta API solo carga los proyectos.
        async function loadProjectsFromAPI() {
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();

                if (data.status === "success" && Array.isArray(data.projects) && data.projects.length > 0) {
                    projectsData = data.projects
                        .filter(p => p.images && p.images.length > 0)
                        .map((p, index) => {
                            const imageUrls = p.images.map(img => {
                                const rawUrl = typeof img === 'object' ? (img.url || img.src) : img;
                                return formatDriveUrl(rawUrl);
                            });

                            return {
                                id: index + 1,
                                title: p.projectName || p.title || `Proyecto ${index + 1}`,
                                category: p.category || "Proyectos Ebanistería",
                                location: p.location || "España",
                                wood: p.wood || "Madera Noble",
                                finish: p.finish || "Acabado Artesanal",
                                craft: p.craft || "Ebanistería de Autor",
                                images: imageUrls,
                                desc: p.desc || p.description || "Proyecto de ebanistería realizado con acabados de alta calidad."
                            };
                        });
                } else {
                    projectsData = fallbackProjectsData;
                }
            } catch (error) {
                console.error("Error al cargar desde API:", error);
                projectsData = fallbackProjectsData;
            } finally {
                finishLoading();
            }
        }

        function finishLoading() {
            const loadingState = document.getElementById("loading-state");
            const photosContainer = document.getElementById("photos-container");

            if (loadingState) loadingState.classList.add("hidden");
            if (photosContainer) photosContainer.classList.remove("hidden");

            buildDynamicCategories();
            renderCategoryFilters();
            renderGallery();
        }

        function buildDynamicCategories() {
            const cats = new Set(projectsData.map(p => p.category).filter(Boolean));
            availableCategories = ["Todos", ...Array.from(cats)];
        }

        function renderCategoryFilters() {
            const container = document.getElementById("category-filters");
            if (!container) return;
            container.innerHTML = availableCategories.map(cat => `
                <button onclick="setCategory('${cat}')" 
                        class="px-4 py-1.5 rounded-full text-xs font-medium transition-all ${
                            activeCategory === cat 
                            ? 'bg-brand-500 text-stone-950 font-semibold shadow-md' 
                            : 'bg-stone-900 border border-stone-800 text-stone-300 hover:border-stone-700 hover:text-white'
                        }">
                    ${cat}
                </button>
            `).join("");
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderCategoryFilters();
            filterPhotos();
        }

        function getFilteredData() {
            const query = (document.getElementById("search-input")?.value || "").toLowerCase();
            return projectsData.filter(p => {
                const matchesCategory = activeCategory === "Todos" || p.category === activeCategory;
                const matchesQuery = (p.title || "").toLowerCase().includes(query) ||
                                     (p.wood || "").toLowerCase().includes(query) ||
                                     (p.location || "").toLowerCase().includes(query) ||
                                     (p.finish || "").toLowerCase().includes(query) ||
                                     (p.category || "").toLowerCase().includes(query);
                return matchesCategory && matchesQuery;
            });
        }

        function renderGallery() {
            const dataToRender = getFilteredData();
            const container = document.getElementById("photos-container");
            const emptyState = document.getElementById("empty-state");
            const countEl = document.getElementById("project-count");

            if (countEl) countEl.textContent = dataToRender.length;

            if (dataToRender.length === 0) {
                if (container) container.innerHTML = "";
                if (emptyState) emptyState.classList.remove("hidden");
                return;
            }

            if (emptyState) emptyState.classList.add("hidden");

            if (container) {
                container.innerHTML = dataToRender.map((project) => `
                    <div class="masonry-item group cursor-pointer" onclick="openLightbox(${project.id})">
                        <div class="relative overflow-hidden rounded-2xl bg-stone-900 border border-stone-800 shadow-lg">
                            <img src="${project.images[0]}" alt="${project.title}" referrerpolicy="no-referrer" class="w-full h-auto object-cover img-hover-zoom">
                            
                            ${project.images.length > 1 ? `
                                <div class="absolute top-3 right-3 bg-stone-950/80 backdrop-blur-md border border-stone-800 text-stone-200 text-[11px] px-2.5 py-1 rounded-full flex items-center gap-1.5">
                                    <i class="fa-solid fa-layer-group text-brand-500 text-[10px]"></i>
                                    <span>${project.images.length} fotos</span>
                                </div>
                            ` : ''}

                            <div class="absolute inset-0 bg-gradient-to-t from-stone-950 via-stone-950/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-5">
                                <span class="text-[10px] font-bold uppercase tracking-widest text-brand-500 bg-stone-950/80 backdrop-blur-md px-2.5 py-1 rounded-full w-max mb-2">
                                    ${project.category}
                                </span>
                                <h3 class="font-serif text-lg font-bold text-white leading-snug">${project.title}</h3>
                            </div>
                        </div>
                    </div>
                `).join("");
            }
        }

        function filterPhotos() {
            renderGallery();
        }

        function resetFilters() {
            const input = document.getElementById("search-input");
            if (input) input.value = "";
            activeCategory = "Todos";
            renderCategoryFilters();
            renderGallery();
        }

        function openLightbox(projectId) {
            currentLightboxProjectIndex = projectsData.findIndex(p => p.id === projectId);
            if (currentLightboxProjectIndex === -1) return;

            currentLightboxImageIndex = 0;
            updateLightboxContent();

            const modal = document.getElementById("lightbox-modal");
            if (modal) modal.classList.remove("hidden");
            document.body.style.overflow = "hidden";
        }

        function updateLightboxContent() {
            const project = projectsData[currentLightboxProjectIndex];
            if (!project) return;

            const imgEl = document.getElementById("lightbox-image");
            if (imgEl) imgEl.src = project.images[currentLightboxImageIndex] || "";

            const counterEl = document.getElementById("lightbox-counter");
            if (counterEl) counterEl.textContent = `Imagen ${currentLightboxImageIndex + 1} de ${project.images.length}`;

            const thumbContainer = document.getElementById("lightbox-thumbnails");
            if (thumbContainer) {
                if (project.images.length > 1) {
                    thumbContainer.innerHTML = project.images.map((img, idx) => `
                        <button onclick="setLightboxImage(${idx})" class="w-12 h-12 rounded-lg overflow-hidden border-2 transition-all ${idx === currentLightboxImageIndex ? 'border-brand-500 scale-105' : 'border-stone-800 opacity-60 hover:opacity-100'}">
                            <img src="${img}" referrerpolicy="no-referrer" class="w-full h-full object-cover">
                        </button>
                    `).join("");
                } else {
                    thumbContainer.innerHTML = "";
                }
            }
        }

        function setLightboxImage(idx) {
            currentLightboxImageIndex = idx;
            updateLightboxContent();
        }

        function prevPhoto() {
            if (currentLightboxImageIndex > 0) {
                currentLightboxImageIndex--;
            } else {
                currentLightboxProjectIndex = (currentLightboxProjectIndex - 1 + projectsData.length) % projectsData.length;
                currentLightboxImageIndex = projectsData[currentLightboxProjectIndex].images.length - 1;
            }
            updateLightboxContent();
        }

        function nextPhoto() {
            const project = projectsData[currentLightboxProjectIndex];
            if (currentLightboxImageIndex < project.images.length - 1) {
                currentLightboxImageIndex++;
            } else {
                currentLightboxProjectIndex = (currentLightboxProjectIndex + 1) % projectsData.length;
                currentLightboxImageIndex = 0;
            }
            updateLightboxContent();
        }

        function closeLightbox() {
            const modal = document.getElementById("lightbox-modal");
            if (modal) modal.classList.add("hidden");
            document.body.style.overflow = "auto";
        }

        function downloadCurrentImage() {
            const url = projectsData[currentLightboxProjectIndex].images[currentLightboxImageIndex];
            if (url) window.open(url, '_blank');
        }
    </script>
</body>
</html>
